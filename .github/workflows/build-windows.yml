name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout application only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            python
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements-build.txt
      - name: Check build sources
        shell: pwsh
        run: |
          @('launcher.py', 'vizja_eeg_lab.py', 'logo.png', 'vizja-eeg-lab.ico', 'requirements-build.txt') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing build input: $_" }
          }
          python -m py_compile launcher.py vizja_eeg_lab.py
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Build standalone application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name Vizja-EEG-Lab --icon vizja-eeg-lab.ico --add-data "vizja_eeg_lab.py;." --add-data "logo.png;." --collect-all streamlit --collect-all altair --collect-all pyarrow --collect-all mne --collect-all neurokit2 --collect-all edfio --collect-all matplotlib --recursive-copy-metadata streamlit --copy-metadata altair --copy-metadata pyarrow --copy-metadata mne --copy-metadata neurokit2 launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (-not (Test-Path 'dist/Vizja-EEG-Lab/Vizja-EEG-Lab.exe')) { throw "EXE was not created" }
      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/Vizja-EEG-Lab/Vizja-EEG-Lab.exe').Path
          $stdout = Join-Path $PWD 'exe-stdout.log'
          $stderr = Join-Path $PWD 'exe-stderr.log'
          $process = Start-Process -FilePath $exe -PassThru -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "EXE exited with code $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8501/_stcore/health' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Streamlit health endpoint did not become ready in 180 seconds' }
            Write-Host 'Packaged EXE started successfully.'
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 1
            Write-Host '==== EXE stdout ===='
            if (Test-Path $stdout) { Get-Content $stdout -Tail 150 }
            Write-Host '==== EXE stderr ===='
            if (Test-Path $stderr) { Get-Content $stderr -Tail 150 }
          }
      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Vizja-EEG-Lab-startup-logs
          path: |
            python/exe-stdout.log
            python/exe-stderr.log
            python/build/Vizja-EEG-Lab/warn-Vizja-EEG-Lab.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Vizja-EEG-Lab-Windows
          path: python/dist/Vizja-EEG-Lab/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
