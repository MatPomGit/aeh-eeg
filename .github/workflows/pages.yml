name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            signal.js app.js enhancements.js enhancements2.js legacy-cleanup.js \
            clinical.js qeeg-workflow.js qeeg-heatmap-v2.js quiz.js live-modules.js \
            eye-tracking-v2.js ui-controller.js teaching-content.js source-model-v2.js interface.js; do
            node --input-type=module --check < "simulator/$file"
          done
          node --check simulator/smoke-check.mjs

      - name: Run static smoke checks
        shell: bash
        run: |
          set -euo pipefail
          node simulator/smoke-check.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/laboratories
          cp simulator/index.html _site/index.html
          cp simulator/laboratories.html _site/laboratories.html
          cp simulator/{app.css,modules.css,eye-tracking-v2.css,source-model-v2.css,theme-dark.css,laboratories.css,interface.css} _site/
          cp simulator/{app.js,enhancements.js,enhancements2.js,legacy-cleanup.js,clinical.js,qeeg-workflow.js,qeeg-heatmap-v2.js,quiz.js,live-modules.js,eye-tracking-v2.js,ui-controller.js,teaching-content.js,source-model-v2.js,interface.js,signal.js} _site/
          cp laboratories/*.pdf _site/laboratories/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
