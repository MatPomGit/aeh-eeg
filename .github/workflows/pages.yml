name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair legacy app.js syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('simulator/app.js')
          text = path.read_text(encoding='utf-8')
          broken = "function bindCommon(root){$$('[data-mode]',root).forEach(b=>{b.classList.toggle('active',b.dataset.mode===state.mode);b.onclick=()=>{state.mode=b.dataset.mode;$$('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode));$$('.student-only').forEach(x=>x.classList.toggle('hidden',state.mode!=='student'))}});$$('[data-check]',root).forEach(b=>b.onclick=()=>{const r=checks[b.dataset.check]?.();finish(b.dataset.check,!!r?.ok,r?.msg||'Warunek nie został jeszcze spełniony.')}})}"
          fixed = "function bindCommon(root){$$('[data-mode]',root).forEach(b=>{b.classList.toggle('active',b.dataset.mode===state.mode);b.onclick=()=>{state.mode=b.dataset.mode;$$('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode));$$('.student-only').forEach(x=>x.classList.toggle('hidden',state.mode!=='student'))}});$$('[data-check]',root).forEach(b=>{b.onclick=()=>{const r=checks[b.dataset.check]?.();finish(b.dataset.check,!!r?.ok,r?.msg||'Warunek nie został jeszcze spełniony.')}})}"
          if broken in text:
              path.write_text(text.replace(broken, fixed, 1), encoding='utf-8')
          PY

          if ! git diff --quiet -- simulator/app.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add simulator/app.js
            git commit -m "Fix app.js syntax"
            git push origin HEAD:main
          fi

      - name: Validate JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < simulator/signal.js
          node --input-type=module --check < simulator/app.js
          node --input-type=module --check < simulator/enhancements.js
          node --input-type=module --check < simulator/enhancements2.js
          node --input-type=module --check < simulator/enhancements3.js
          node --input-type=module --check < simulator/physiology-eye.js
          node --input-type=module --check < simulator/clinical-learning.js
          node --input-type=module --check < simulator/qeeg-workflow.js
          node --input-type=module --check < simulator/qeeg-heatmap-v2.js
          node --input-type=module --check < simulator/flashcards.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp simulator/index.html _site/index.html
          cp simulator/app.css _site/app.css
          cp simulator/enhancements.css _site/enhancements.css
          cp simulator/enhancements2.css _site/enhancements2.css
          cp simulator/enhancements3.css _site/enhancements3.css
          cp simulator/app.js _site/app.js
          cp simulator/enhancements.js _site/enhancements.js
          cp simulator/enhancements2.js _site/enhancements2.js
          cp simulator/enhancements3.js _site/enhancements3.js
          cp simulator/physiology-eye.js _site/physiology-eye.js
          cp simulator/clinical-learning.js _site/clinical-learning.js
          cp simulator/qeeg-workflow.js _site/qeeg-workflow.js
          cp simulator/qeeg-heatmap-v2.js _site/qeeg-heatmap-v2.js
          cp simulator/flashcards.js _site/flashcards.js
          cp simulator/signal.js _site/signal.js
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
