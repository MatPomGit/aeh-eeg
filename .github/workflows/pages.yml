name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in simulator/*.js; do
            node --input-type=module --check < "$file"
          done
          node --check simulator/smoke-check.mjs

      - name: Run static smoke checks
        shell: bash
        run: |
          set -euo pipefail
          node simulator/smoke-check.mjs

      - name: Test simulation models
        run: node --test simulator/*.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/laboratories
          find simulator -maxdepth 1 -type f \( \
            -name '*.html' -o -name '*.css' -o -name '*.js' -o \
            -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o \
            -name '*.jpeg' -o -name '*.webp' -o -name '*.ico' \
          \) -exec cp {} _site/ \;
          find laboratories -maxdepth 1 -type f -name '*.pdf' -exec cp {} _site/laboratories/ \;
          touch _site/.nojekyll

      - name: Verify built site
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/interface.js
          test -f _site/signal.js
          test -f _site/logo.svg
          test -f _site/favicon.svg
          test -f _site/laboratories.html
          test -n "$(find _site/laboratories -maxdepth 1 -type f -name '*.pdf' -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
